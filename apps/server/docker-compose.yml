version: '3.9'

services:
  inkroom-server:
    build:
      context: .
      target: production
    ports:
      - '${PORT:-5000}:5000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-secret}@db:27017/${MONGO_DB:-appdb}?authSource=admin
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-appdb}
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge

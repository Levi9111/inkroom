version: '3.8'

services:
  inkroom:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: ghcr.io/levi9111/inkroom:latest
    container_name: inkroom-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGODB_URI=mongodb://mongo:27017/inkroom
      - JWT_SECRET=change-this-to-a-very-secure-random-secret
      - ALLOWED_ORIGINS=http://localhost:8080
      - ASSET_STORAGE=local
      - UPLOAD_DIR=/app/uploads
      - BOARD_RETENTION_DAYS=30
    volumes:
      - inkroom-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: inkroom-mongo
    restart: unless-stopped
    volumes:
      - inkroom-db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inkroom-uploads:
  inkroom-db:
